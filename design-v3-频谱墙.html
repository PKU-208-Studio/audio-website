<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>午夜电台 · V3 频谱墙</title>
<style>
  :root{
    --bg:#03040a;--ink:#eef2ff;--dim:#6f77a0;
    --red:#ff3366;--cyan:#19dcff;--violet:#b25bff;--green:#25ffa7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);overflow-x:hidden}
  #spectrum{position:fixed;inset:0;z-index:0;opacity:.9}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 80% at 50% 30%,transparent 40%,var(--bg) 92%)}
  .grain{position:fixed;inset:0;pointer-events:none;opacity:.05;z-index:2;
    background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px}
  .wrap{position:relative;z-index:3;min-height:100vh;display:flex;flex-direction:column}

  header{display:flex;justify-content:space-between;align-items:center;padding:26px 48px}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:5px;font-size:18px}
  .brand em{font-style:normal;font-size:11px;color:var(--dim);letter-spacing:4px}
  .eqmark{display:flex;gap:3px;align-items:flex-end;height:20px}
  .eqmark i{width:3px;background:var(--cyan);border-radius:2px;box-shadow:0 0 8px var(--cyan);animation:eq .9s ease-in-out infinite}
  .eqmark i:nth-child(1){background:var(--red);box-shadow:0 0 8px var(--red);animation-delay:0s}
  .eqmark i:nth-child(2){background:var(--cyan);animation-delay:.2s}
  .eqmark i:nth-child(3){background:var(--violet);box-shadow:0 0 8px var(--violet);animation-delay:.1s}
  .eqmark i:nth-child(4){background:var(--green);box-shadow:0 0 8px var(--green);animation-delay:.3s}
  @keyframes eq{0%,100%{height:20%}50%{height:100%}}
  nav{display:flex;gap:30px;font-size:13px}
  nav a{color:var(--dim);text-decoration:none;letter-spacing:2px;transition:.3s}
  nav a:hover{color:var(--ink)}

  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
  .center .time{font-family:"Courier New",monospace;font-size:13px;color:var(--dim);letter-spacing:5px;margin-bottom:18px}
  .center h1{font-size:60px;letter-spacing:8px;font-weight:800;line-height:1.1;
    text-shadow:0 0 40px rgba(120,140,255,.4)}
  .center h1 .glow{background:linear-gradient(90deg,var(--red),var(--violet),var(--cyan),var(--green));
    -webkit-background-clip:text;background-clip:text;color:transparent;background-size:300%;animation:flow 7s linear infinite}
  @keyframes flow{to{background-position:300% 0}}
  .center p{color:var(--dim);letter-spacing:4px;font-size:14px;margin-top:16px}

  .picker{display:flex;gap:14px;margin-top:40px;flex-wrap:wrap;justify-content:center}
  .pill{display:flex;align-items:center;gap:10px;padding:12px 22px;border-radius:40px;cursor:pointer;
    background:rgba(10,12,24,.6);backdrop-filter:blur(8px);border:1px solid #1a1f3d;transition:.35s;letter-spacing:2px;font-size:14px}
  .pill .d{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
  .pill:hover,.pill.on{border-color:var(--c);box-shadow:0 0 26px color-mix(in srgb,var(--c) 40%,transparent);transform:translateY(-4px)}
  .pill small{color:var(--dim);font-family:"Courier New",monospace;font-size:11px}
  .pill.red{--c:var(--red)}.pill.cyan{--c:var(--cyan)}.pill.violet{--c:var(--violet)}.pill.green{--c:var(--green)}

  /* player */
  .player{display:flex;align-items:center;gap:20px;margin:0 48px 26px;padding:16px 24px;border-radius:18px;
    background:rgba(8,10,20,.72);backdrop-filter:blur(14px);border:1px solid #191d38}
  .play{width:52px;height:52px;border-radius:50%;flex:none;cursor:pointer;border:none;
    background:var(--cur,var(--cyan));box-shadow:0 0 26px var(--cur,var(--cyan));position:relative;transition:.4s}
  .play::before{content:"";position:absolute;top:50%;left:54%;transform:translate(-50%,-50%);
    border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent #04050c}
  .meta{flex:1;text-align:left}
  .meta b{font-size:16px;letter-spacing:2px}
  .meta small{display:block;color:var(--dim);font-size:12px;letter-spacing:1px;margin-top:3px}
  .track{flex:2;height:4px;border-radius:4px;background:#1a1f3d;position:relative;overflow:hidden}
  .track i{position:absolute;left:0;top:0;bottom:0;width:34%;background:var(--cur,var(--cyan));box-shadow:0 0 12px var(--cur,var(--cyan))}
  .dur{font-family:"Courier New",monospace;font-size:12px;color:var(--dim)}
  @media(max-width:820px){.center h1{font-size:38px;letter-spacing:4px}.track{display:none}}
</style>
</head>
<body>
<canvas id="spectrum"></canvas>
<div class="vignette"></div>
<div class="grain"></div>

<div class="wrap">
  <header>
    <div class="brand"><span class="eqmark"><i></i><i></i><i></i><i></i></span>午夜电台 <em>MIDNIGHT&nbsp;FM</em></div>
    <nav><a href="#">直播中</a><a href="#">全部频道</a><a href="#">收藏</a><a href="#">登录</a></nav>
  </header>

  <div class="center">
    <div class="time" id="clock">深夜 03:47:12</div>
    <h1>让声音<span class="glow">点亮</span>黑夜</h1>
    <p>四种频率，四种黑夜的模样</p>
    <div class="picker" id="picker">
      <div class="pill red on" data-c="--red" data-name="悬疑惊悚" data-desc="密室 · 追凶 · 深夜来电"><span class="d"></span>悬疑惊悚 <small>89.4</small></div>
      <div class="pill cyan" data-c="--cyan" data-name="科幻宇宙" data-desc="飞船 · AI · 星际回声"><span class="d"></span>科幻宇宙 <small>95.0</small></div>
      <div class="pill violet" data-c="--violet" data-name="情感治愈" data-desc="晚安信 · 白噪音 · 慢慢睡"><span class="d"></span>情感治愈 <small>101.3</small></div>
      <div class="pill green" data-c="--green" data-name="都市怪谈" data-desc="第十三层 · 午夜便利店"><span class="d"></span>都市怪谈 <small>106.7</small></div>
    </div>
  </div>

  <div class="player">
    <button class="play"></button>
    <div class="meta"><b id="pName">悬疑惊悚 · 第七夜</b><small id="pDesc">密室 · 追凶 · 深夜来电</small></div>
    <div class="track"><i></i></div>
    <div class="dur">12:47 / 38:20</div>
  </div>
</div>

<script>
const map={'--red':'#ff3366','--cyan':'#19dcff','--violet':'#b25bff','--green':'#25ffa7'};
let cur=map['--red'];
const cv=document.getElementById('spectrum'),ctx=cv.getContext('2d');
let W,H,dpr=window.devicePixelRatio||1;
function resize(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
resize();addEventListener('resize',resize);

const N=64;const bars=new Array(N).fill(0).map(()=>Math.random());
function hex2rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
let t=0;
function draw(){
  ctx.clearRect(0,0,W,H);
  const bw=W/N;const [r,g,b]=hex2rgb(cur);
  for(let i=0;i<N;i++){
    const target=Math.abs(Math.sin(i*0.4+t*2))*0.6+Math.random()*0.4;
    bars[i]+= (target-bars[i])*0.15;
    const h=bars[i]*H*0.42;
    const x=i*bw;
    const grad=ctx.createLinearGradient(0,H,0,H-h);
    grad.addColorStop(0,`rgba(${r},${g},${b},0.05)`);
    grad.addColorStop(1,`rgba(${r},${g},${b},0.65)`);
    ctx.fillStyle=grad;
    ctx.fillRect(x+bw*0.15,H-h,bw*0.7,h);
    // mirrored top
    const grad2=ctx.createLinearGradient(0,0,0,h*0.6);
    grad2.addColorStop(0,`rgba(${r},${g},${b},0.28)`);
    grad2.addColorStop(1,`rgba(${r},${g},${b},0)`);
    ctx.fillStyle=grad2;
    ctx.fillRect(x+bw*0.15,0,bw*0.7,h*0.6);
  }
  t+=0.016;requestAnimationFrame(draw);
}
draw();

document.querySelectorAll('.pill').forEach(p=>{
  p.addEventListener('click',()=>{
    document.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));
    p.classList.add('on');
    cur=map[p.dataset.c];
    document.documentElement.style.setProperty('--cur',cur);
    document.getElementById('pName').textContent=p.dataset.name+' · 第七夜';
    document.getElementById('pDesc').textContent=p.dataset.desc;
  });
});
document.documentElement.style.setProperty('--cur',cur);

// clock
setInterval(()=>{
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  document.getElementById('clock').textContent='深夜 '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
},1000);
</script>
</body>
</html>
